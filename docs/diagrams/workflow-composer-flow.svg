<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc">
  <title id="title">Workflow composer proposal and save flow</title>
  <desc id="desc">The Workflow composer returns an unsaved proposal. A person reviews and edits it, then explicitly saves through the normal collection-scoped editor. Generation never commits or executes the workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46627f"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#162b43}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.node{stroke:#46627f;stroke-width:2;rx:12}.line{stroke:#46627f;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1160" height="470" fill="#f7fafc"/>
  <text x="40" y="48" class="title">Generation proposes; a person decides what to save</text>
  <rect x="35" y="130" width="170" height="84" class="node" fill="#e7f0f8"/>
  <text x="120" y="166" text-anchor="middle" class="label">Describe a goal</text>
  <text x="120" y="190" text-anchor="middle" class="small">Person supplies context</text>
  <rect x="255" y="130" width="190" height="84" class="node" fill="#e4f3ef"/>
  <text x="350" y="166" text-anchor="middle" class="label">Workflow composer</text>
  <text x="350" y="190" text-anchor="middle" class="small">Bounded proposal path</text>
  <rect x="495" y="130" width="190" height="84" class="node" fill="#fff1d8"/>
  <text x="590" y="166" text-anchor="middle" class="label">Unsaved proposal</text>
  <text x="590" y="190" text-anchor="middle" class="small">No catalog mutation</text>
  <rect x="735" y="130" width="190" height="84" class="node" fill="#e7f0f8"/>
  <text x="830" y="166" text-anchor="middle" class="label">Review and edit</text>
  <text x="830" y="190" text-anchor="middle" class="small">Human confirmation</text>
  <path d="M205 172H247M445 172H487M685 172H727" class="line"/>
  <polygon points="1005,122 1085,172 1005,222 925,172" fill="#eee9fa" stroke="#46627f" stroke-width="2"/>
  <text x="1005" y="167" text-anchor="middle" class="label">Writable</text>
  <text x="1005" y="189" text-anchor="middle" class="small">collection?</text>
  <path d="M925 172H932" class="line"/>
  <rect x="830" y="305" width="195" height="78" class="node" fill="#e4f3ef"/>
  <text x="927" y="338" text-anchor="middle" class="label">Explicit editor save</text>
  <text x="927" y="361" text-anchor="middle" class="small">Normal validation / concurrency</text>
  <rect x="1075" y="305" width="65" height="78" class="node" fill="#fce8e6"/>
  <text x="1107" y="349" text-anchor="middle" class="small">Stop</text>
  <path d="M1005 222V270H927V297M1085 172H1107V297" class="line"/>
  <rect x="410" y="305" width="350" height="78" class="node" fill="#e7f0f8"/>
  <text x="585" y="338" text-anchor="middle" class="label">Collection-scoped catalog storage</text>
  <text x="585" y="361" text-anchor="middle" class="small">Only after explicit save</text>
  <path d="M830 344H768" class="line"/>
  <text x="560" y="430" text-anchor="middle" class="small">Generation never auto-saves or executes agents, plugins, tools, services or workflow steps.</text>
</svg>
