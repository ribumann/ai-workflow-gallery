<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Collection request and MCP flow</title>
  <desc id="desc">Every REST and MCP request validates one explicit collection. Published scopes expose eight read tools. Playground exposes writes only when a separate write capability is enabled and checked by the database and storage boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46627f"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#162b43}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.node{stroke:#46627f;stroke-width:2;rx:12}.line{stroke:#46627f;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="680" fill="#f7fafc"/>
  <text x="40" y="48" class="title">One scope resolves to one capability set</text>
  <rect x="40" y="90" width="205" height="72" class="node" fill="#e7f0f8"/>
  <text x="142" y="120" text-anchor="middle" class="label">REST or MCP request</text>
  <text x="142" y="143" text-anchor="middle" class="small">explicit collectionId</text>
  <polygon points="355,83 445,126 355,169 265,126" fill="#fff1d8" stroke="#46627f" stroke-width="2"/>
  <text x="355" y="121" text-anchor="middle" class="label">Valid, unique</text>
  <text x="355" y="143" text-anchor="middle" class="small">and matching?</text>
  <path d="M245 126H258" class="line"/>
  <rect x="270" y="220" width="170" height="58" class="node" fill="#fce8e6"/>
  <text x="355" y="255" text-anchor="middle" class="label">Reject / no scope</text>
  <path d="M355 169V212" class="line"/>
  <text x="368" y="195" class="small">no</text>
  <rect x="500" y="90" width="235" height="72" class="node" fill="#e4f3ef"/>
  <text x="617" y="120" text-anchor="middle" class="label">Resolve capability</text>
  <text x="617" y="143" text-anchor="middle" class="small">per request, fail closed</text>
  <path d="M445 126H492" class="line"/>
  <text x="462" y="113" class="small">yes</text>
  <rect x="820" y="55" width="255" height="80" class="node" fill="#e7f0f8"/>
  <text x="947" y="87" text-anchor="middle" class="label">public-techniques</text>
  <text x="947" y="111" text-anchor="middle" class="small">published; read only</text>
  <rect x="820" y="165" width="255" height="80" class="node" fill="#e7f0f8"/>
  <text x="947" y="197" text-anchor="middle" class="label">curated-tools</text>
  <text x="947" y="221" text-anchor="middle" class="small">published; read only</text>
  <rect x="820" y="275" width="255" height="80" class="node" fill="#fff1d8"/>
  <text x="947" y="307" text-anchor="middle" class="label">playground</text>
  <text x="947" y="331" text-anchor="middle" class="small">shared; disposable</text>
  <path d="M735 112H790V95H812M790 112V205H812M790 112V315H812" class="line"/>
  <rect x="80" y="400" width="390" height="85" class="node" fill="#e7f0f8"/>
  <text x="275" y="434" text-anchor="middle" class="label">Published MCP connections</text>
  <text x="275" y="461" text-anchor="middle" class="small">Eight existing read tools; write calls hidden and refused</text>
  <rect x="620" y="400" width="390" height="85" class="node" fill="#fff1d8"/>
  <text x="815" y="434" text-anchor="middle" class="label">Playground MCP connection</text>
  <text x="815" y="461" text-anchor="middle" class="small">Eight reads + twelve writes when explicitly enabled</text>
  <path d="M947 135V390H470V408M947 355V390H1018V408" class="line"/>
  <rect x="190" y="545" width="740" height="75" class="node" fill="#eee9fa"/>
  <text x="560" y="578" text-anchor="middle" class="label">Same policy reaches handlers, persistence, references and file storage</text>
  <text x="560" y="601" text-anchor="middle" class="small">Discovery and execution agree; database-side protection remains an independent boundary</text>
  <path d="M275 485V537M815 485V537" class="line"/>
</svg>
